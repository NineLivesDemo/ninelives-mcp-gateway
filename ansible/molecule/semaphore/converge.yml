---
- name: Render Semaphore Compose template
  hosts: all
  gather_facts: true
  vars_files:
    - ../../roles/semaphore/defaults/main.yml
  tasks:
    - name: Set controlled automation VM private address
      ansible.builtin.set_fact:
        ansible_facts:
          default_ipv4:
            address: 10.61.5.4

    - name: Create Semaphore template test directory
      ansible.builtin.file:
        path: /tmp/semaphore-template-test
        state: directory
        mode: "0700"

    - name: Render Semaphore Compose template with role defaults
      ansible.builtin.template:
        src: ../../roles/semaphore/templates/docker-compose.yml.j2
        dest: /tmp/semaphore-template-test/docker-compose.yml
        mode: "0600"
