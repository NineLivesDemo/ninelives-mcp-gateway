apisix:
  node_listen: 9080
  enable_ipv6: false

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  admin:
    admin_key:
      - name: admin
        key: ${{APISIX_ADMIN_KEY}}
        role: admin
    # The host port is loopback-only in Compose. This allowlist also limits
    # Admin API callers to loopback and Docker's private address space.
    allow_admin:
      - 127.0.0.0/8
      - 172.16.0.0/12
    admin_listen:
      ip: 0.0.0.0
      port: 9180
  etcd:
    host:
      - http://etcd:2379
    prefix: /apisix
    timeout: 30

nginx_config:
  error_log_level: warn
